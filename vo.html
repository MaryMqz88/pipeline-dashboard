function getPP(){try{return localStorage.getItem("pipeline-pp-coord")||""}catch{return""}}
async function aP(p){try{const pp=getPP();const body={...p};if(pp)body.passphrase=pp;const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(d&&d.error){alert("⚠ Server error: "+d.error+(d.message?"\n\n"+d.message:""));return d}if(d&&d.warning){alert("⚠ "+d.warning)}return d||true}catch(e){alert("⚠ Network error: "+e.message);return false}}

const load=useCallback(async(silent)=>{if(!silent)sLd(true);sEr(null);try{const pp=getPP();const r=await fetch(API+"?action=getVariations&user="+encodeURIComponent(user)+(pp?"&passphrase="+encodeURIComponent(pp):""));const d=await r.json();if(d.error){if(d.error==="AUTH_FAILED"){try{localStorage.removeItem("pipeline-pp-coord")}catch{};setPp("");sEr("Wrong coordinator passphrase. Please re-enter.");sLd(false);return}sEr(d.error);sLd(false);return}
const vD=d.variations||d.vos||[];
if(d.allProjectStatuses)setAllProjStatuses(d.allProjectStatuses);
// Project list comes from a separate getAll call so the +Add picker has all options.
let pD=[];try{const r2=await fetch(API+"?action=getAll"+(pp?"&passphrase="+encodeURIComponent(pp):""));const d2=await r2.json();if(d2&&!d2.error)pD=d2.projects||[]}catch{}
// Filter projects to those assigned to the current coord (or "all"). Hides system projects starting with _.
const isCoordAssigned=(coordField,coord)=>{
  if(!coordField)return false;
  const t=String(coordField).trim().toLowerCase();
  if(!t)return false;
  if(t==="all")return true;
  return t.split(",").map(s=>s.trim()).includes(coord.toLowerCase());
};
sPj(pD
  .map(p=>({nm:String(F(p,"Project","PROJECT")).trim(),coord:String(F(p,"COORDINATOR")||""),st:String(F(p,"Status","STATUS"))||"Live"}))
  .filter(p=>!p.nm.startsWith("_"))
  .filter(p=>isCoordAssigned(p.coord,user)));
sVo(vD.map((v,i)=>({i,_r:v._row!==undefined?v._row:i,
vid:String(F(v,"VO_ID")||""),
pj:String(F(v,"PROJECT","Project")).trim(),
area:String(F(v,"AREA ON JOB","")||""),
ty:String(F(v,"TYPE","Type")),
vn:String(F(v,"VARIATION NO.")),
srn:String(F(v,"SUB REF NO.","Sub Ref No.")||""),
vnm:String(F(v,"VARIATION NAME")),
ds:fmD(String(F(v,"DATE SUBMITTED"))),
da:fmD(String(F(v,"DATE APPROVED"))),
pr:N(F(v,"PRICE","REVENUE")),
claim:String(F(v,"CLAIM %","")||""),
st:String(F(v,"STATUS","Status")),
em:N(F(v,"EXTERNAL MATERIALS")),
pf:N(F(v,"PFAB MATERIALS")),
nmn:N(F(v,"NO. OF MEN")),

nr:N(F(v,"NORMAL RATE")),
oh:N(F(v,"OVERTIME HOURS")),
or2:N(F(v,"OVERTIME RATE")),
notes:String(F(v,"NOTES","Notes")||""),
creator:String(F(v,"CREATOR")||""),
pushedAt:String(F(v,"PUSHED AT")||""),
pushedBy:String(F(v,"PUSHED BY")||""),
eb:String(F(v,"EditedBy","EDITED BY")||""),
ea:String(F(v,"EditedAt","EDITED AT")||"")
})));
sLd(false)}catch(e){sEr("Failed to connect: "+e.message);sLd(false)}},[user]);

// Heartbeat: ping every 60s while logged in (lock-free on server)
useEffect(()=>{if(!identity||!pp)return;const ping=()=>{fetch(API+"?action=heartbeat&user="+encodeURIComponent(identity)+"&passphrase="+encodeURIComponent(pp)+"&t="+Date.now()).catch(()=>{})};ping();const id=setInterval(ping,60000);return()=>clearInterval(id)},[identity,pp]);
// Realtime: subscribe to DB changes via websocket and silently refresh on any change.
useEffect(()=>{if(!user||!pp)return;
  if(SUPABASE_ANON_KEY==="PASTE_ANON_KEY_HERE"){console.warn("Realtime disabled: SUPABASE_ANON_KEY not set");return}
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  let dt=null;
  const triggerReload=()=>{if(dt)clearTimeout(dt);dt=setTimeout(()=>wqRef.current.then(()=>load(true)),300)};
  const ch=sb.channel("vo-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"variations"},triggerReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"projects"},triggerReload)
    .subscribe();
  return()=>{if(dt)clearTimeout(dt);sb.removeChannel(ch)};
},[user,pp,load]);

const tAgo=(ts)=>{if(!ts)return"";const d=Date.now()-new Date(ts).getTime();if(d<60000)return"just now";if(d<3600000)return Math.floor(d/60000)+" min ago";if(d<86400000)return Math.floor(d/3600000)+"h ago";return Math.floor(d/86400000)+"d ago"};

const calcDLPrice=(v,fd,val)=>{const u={...v,[fd]:val};const m=N(u.nmn)||1;return(m*N(u.nh)*N(u.nr))+(m*N(u.oh)*N(u.or2))};
const uV=useCallback(async(vid,fd,val)=>{const v=vo.find(x=>x.vid===vid);if(!v)return;if(v._pending){alert("⏳ This VO is still saving.\n\nPlease wait a few seconds for it to finish, then try editing.");return}
// Status revert warning: changing FROM Fully/Partially Claimed
if(fd==="st"){const oldStL=String(v.st||"").toLowerCase();if((oldStL.includes("fully claimed")||oldStL.includes("partially claimed"))&&val!==v.st){if(!confirm("⚠️ Please double check.\n\nThis VO is currently marked \""+v.st+"\". Are you sure you want to change it to \""+val+"\"?\n\nReverting a claimed status can affect the audit trail."))return}}
const autoP=v.ty==="DL"&&["nmn","nh","nr","oh","or2"].includes(fd);const newPr=autoP?calcDLPrice(v,fd,val):null;sVo(pr=>pr.map(x=>x.vid===vid?{...x,[fd]:val,...(autoP?{pr:newPr}:{}),ea:new Date().toISOString()}:x));
const m2={"pj":"PROJECT","area":"AREA ON JOB","ty":"TYPE","vn":"VARIATION NO.","srn":"SUB REF NO.","vnm":"VARIATION NAME","ds":"DATE SUBMITTED","da":"DATE APPROVED","pr":"PRICE","claim":"CLAIM %","st":"STATUS","em":"EXTERNAL MATERIALS","pf":"PFAB MATERIALS","nmn":"NO. OF MEN","nh":"NORMAL HOURS","nr":"NORMAL RATE","oh":"OVERTIME HOURS","or2":"OVERTIME RATE","notes":"NOTES"};
sSv(true);await enq(()=>aP({action:"updateVariation",voId:v.vid,field:m2[fd]||fd,value:val,editedBy:identity,editedAt:new Date().toLocaleString("en-AU")}));if(autoP)await enq(()=>aP({action:"updateVariation",voId:v.vid,field:"PRICE",value:newPr,editedBy:identity,editedAt:new Date().toLocaleString("en-AU")}));sSv(false)},[vo,user,identity]);

const dVO=async(v)=>{if(v._pending){alert("⏳ This VO is still saving.\n\nPlease wait a few seconds for it to finish syncing, then try again.");return}const stL=String(v.st||"").toLowerCase();if(stL.indexOf("fully claimed")!==-1||stL.indexOf("partially claimed")!==-1){alert("⛔ Cannot delete this VO.\n\nThis VO has been marked as \""+v.st+"\".\n\nClaimed VOs are locked to protect the audit trail. If this needs to be removed, contact an admin.");return}if(!confirm("Delete VO: "+(v.vnm||v.pj||"entry")+"?"))return;sSv(true);sVo(prev=>prev.filter(x=>v.vid?x.vid!==v.vid:x.i!==v.i));await enq(()=>aP({action:"deleteVariation",voId:v.vid}));sSv(false)};

const pushVO=async(v)=>{
if(!v.vid||v.vid.startsWith("vo_pending_")){alert("⏳ This VO is still saving.\n\nPlease wait a moment and try again.");return}
const wasPushed=!!v.pushedAt;
if(!confirm(wasPushed?"Re-push \""+v.vnm+"\" to update Master?":"Push \""+v.vnm+"\" to Master VO Register?"))return;
sSv(true);
const now=new Date().toISOString();
sVo(prev=>prev.map(x=>(v.vid?x.vid===v.vid:x.i===v.i)?{...x,pushedAt:now,pushedBy:identity,ea:now}:x));
await enq(()=>aP({action:"pushVariation",voId:v.vid}));
sSv(false)};

const addV=async()=>{if(!nvo.project)return;sSv(true);sSa(false);const newVo={...nvo};sNvo({project:"",type:"VO",varNo:"",varName:"",ds:"",da:"",price:0,status:"",em:0,pf:0});const fullVarNo=(newVo.type==="DL"?"DL-":"VO-")+newVo.varNo;
// Optimistic insert: show the row immediately. After server returns, update local state with the real voId
// so push/edit operations on the just-added VO work without waiting for realtime reload.
const tempId="vo_pending_"+Date.now();const nowIso=new Date().toISOString();
sVo(prev=>[{i:prev.length,_r:prev.length,vid:tempId,pj:newVo.project,area:"",ty:newVo.type,vn:fullVarNo,srn:"",vnm:newVo.varName,ds:newVo.ds,da:newVo.da,pr:newVo.price,claim:"",st:newVo.status,em:newVo.em,pf:newVo.pf,nmn:0,nh:0,nr:0,oh:0,or2:0,notes:"",creator:user,pushedAt:"",pushedBy:"",eb:identity,ea:nowIso,_pending:true},...prev]);
const result=await enq(()=>aP({action:"addVariation",creator:user,project:newVo.project,type:newVo.type,varNo:fullVarNo,varName:newVo.varName,dateSubmitted:newVo.ds,dateApproved:newVo.da,price:newVo.price,status:newVo.status,extMaterials:newVo.em,pfabMaterials:newVo.pf,claimPct:"",areaOnJob:"",notes:"",editedBy:identity,editedAt:new Date().toLocaleString("en-AU")}));
if(result&&result.voId){sVo(prev=>prev.map(x=>x.vid===tempId?{...x,vid:result.voId,_pending:false}:x))}
sSv(false)};

const voFilt=useMemo(()=>{
  let f=vo.filter(v=>isRealProject(v.pj));
  if(voView==="project"&&selectedProject)f=f.filter(v=>v.pj===selectedProject);
  else if(voView==="status"&&selectedStatusOnly)f=f.filter(v=>matchStatus(v.st,selectedStatusOnly));
  if(filtPj_d){
    const q=filtPj_d.toLowerCase();
    if(voView==="project")f=f.filter(v=>v.vnm&&v.vnm.toLowerCase().includes(q));
    else f=f.filter(v=>v.pj.toLowerCase().includes(q)||(v.vnm&&v.vnm.toLowerCase().includes(q)));
  }
  if(filtTy_d!=="all")f=f.filter(v=>v.ty===filtTy_d);
  if(filtSt_d.length>0)f=f.filter(v=>filtSt_d.some(s=>matchStatus(v.st,s)));
  if(sortCol)return f.slice().sort((a,b)=>cmp(a,b,sortCol,sortDir||"asc"));
  return f
},[vo,voView,selectedProject,selectedStatusOnly,filtPj_d,filtTy_d,filtSt_d,sortCol,sortDir]);

// Project cards: only projects that have VOs. Excludes system + pipeline categories.
const projectCards=useMemo(()=>{
  const pjByName=new Map();pj.forEach(p=>pjByName.set(p.nm,p.st||"Live"));
  const grouped=new Map();
  vo.forEach(v=>{
    if(!isRealProject(v.pj))return;
    if(!grouped.has(v.pj))grouped.set(v.pj,{name:v.pj,vos:0,total:0,statusCounts:{},projectStatus:pjByName.get(v.pj)||allProjStatuses[v.pj]||"Live"});
    const g=grouped.get(v.pj);
    g.vos++;
    g.total+=Number(v.pr)||0;
    VO_ST.forEach(s=>{if(matchStatus(v.st,s.v))g.statusCounts[s.v]=(g.statusCounts[s.v]||0)+1});
  });
  return Array.from(grouped.values()).sort((a,b)=>a.name.localeCompare(b.name));
},[vo,pj,allProjStatuses]);

const filteredCards=useMemo(()=>{
  if(!filtPj_d)return projectCards;
  const q=filtPj_d.toLowerCase();
  return projectCards.filter(c=>c.name.toLowerCase().includes(q)||vo.some(v=>v.pj===c.name&&v.vnm&&v.vnm.toLowerCase().includes(q)));
},[projectCards,filtPj_d,vo]);

{voView==="status"&&<span className="detail-title" style={{marginLeft:0}}>All VOs marked <b>{selectedStatusOnly==="(blank)"?"No Status":selectedStatusOnly}</b></span>}
</div>
<div style={{display:"flex",alignItems:"center",gap:6}}>
{(voView==="project"||voView==="home")&&<button className="pl gn" onClick={()=>{if(voView==="project")sNvo({...nvo,project:selectedProject});else sNvo({...nvo,project:""});sSa(!sa)}}>{sa?"Cancel":"+ Add VO"}</button>}
{selRows.size>0&&voView==="project"&&<select defaultValue="" onChange={async e=>{const newStatus=e.target.value;e.target.value="";if(!newStatus)return;if(!confirm("Change status to \""+newStatus+"\" for "+selRows.size+" selected VOs?"))return;sSv(true);const editedAt=new Date().toLocaleString("en-AU");for(const r of selRows){const v=vo.find(x=>x.vid===r);if(v&&v.vid&&!v.vid.startsWith("vo_pending_")){sVo(prev=>prev.map(x=>x.vid===r?{...x,st:newStatus,eb:identity,ea:editedAt}:x));await enq(()=>aP({action:"updateVariation",voId:v.vid,field:"STATUS",value:newStatus,editedBy:identity,editedAt}))}}setSelRows(new Set());sSv(false)}} style={{padding:"3px 6px",fontSize:10,borderRadius:4,border:"1px solid var(--ac)",cursor:"pointer",background:"#fff",color:"var(--ac)",fontFamily:"var(--ft)",fontWeight:600}}><option value="">Set Status ({selRows.size})...</option>{VO_ST.filter(s=>s.v!=="(blank)").map(s=><option key={s.v} value={s.v}>{s.v}</option>)}</select>}
{selRows.size>0&&voView==="project"&&<button className="pl gn" onClick={async()=>{if(!confirm("Push "+selRows.size+" selected VOs to Master?"))return;sSv(true);const now=new Date().toISOString();for(const r of selRows){const v=vo.find(x=>x.vid===r);if(v){sVo(prev=>prev.map(x=>(v.vid?x.vid===v.vid:x._r===r)?{...x,pushedAt:now,pushedBy:identity}:x));await enq(()=>aP({action:"pushVariation",voId:v.vid}))}}setSelRows(new Set());sSv(false)}}>{selRows.size} Push Selected</button>}
</div>
</div>
<div className="br" style={{flexWrap:"wrap"}}>
<div style={{display:"flex",gap:2}}>{["all","VO","DL"].map(t=><button key={t} onClick={()=>setFiltTy(t)} style={{padding:"2px 10px",borderRadius:10,border:"1px solid",borderColor:filtTy===t?"var(--ac)":"var(--bd)",background:filtTy===t?"var(--ac)":"transparent",color:filtTy===t?"#fff":"var(--t2)",fontSize:9,fontWeight:600,cursor:"pointer",fontFamily:"var(--ft)"}}>{t==="all"?"All":t}</button>)}</div>
<div style={{display:"flex",gap:2,flexWrap:"wrap"}}>{VO_ST.map(s=>{const cnt=stCnt[s.v]||0;const isActive=voView==="status"?selectedStatusOnly===s.v:filtSt.includes(s.v);const isDisabled=voView==="status"&&selectedStatusOnly!==s.v;return<button key={s.v} disabled={isDisabled} onClick={()=>{if(voView==="home"){setVoView("status");setSelectedStatusOnly(s.v);setFiltPj("")}else if(voView==="project"){setFiltSt(p=>p.includes(s.v)?p.filter(x=>x!==s.v):[...p,s.v])}}} style={{padding:"2px 6px",borderRadius:10,border:"1px solid",borderColor:isActive?s.c:"var(--bd)",background:isActive?s.c:"transparent",color:isActive?"#fff":s.c,fontSize:8,fontWeight:600,cursor:isDisabled?"not-allowed":"pointer",opacity:isDisabled?0.3:1,fontFamily:"var(--ft)"}}>{s.v==="(blank)"?"No Status":s.v.split(" - ")[0].split(" ").slice(0,2).join(" ")} ({cnt})</button>})}</div>
<input className="sx" placeholder="Search project or variation name" value={filtPj} onChange={e=>setFiltPj(e.target.value)}/>
{Array.from(HIDEABLE_COLS).map(label=><label key={label} style={{display:"flex",alignItems:"center",gap:3,fontSize:9,color:"var(--t2)",cursor:"pointer",userSelect:"none"}}><input type="checkbox" checked={!hideCols.has(label)} onChange={()=>toggleHide(label)} style={{cursor:"pointer"}}/>{label}</label>)}
{sortCol&&<span style={{fontSize:9,padding:"2px 6px",border:"1px solid var(--ac)",borderRadius:10,background:"var(--ac)",color:"#fff",display:"flex",gap:4,alignItems:"center",cursor:"pointer"}} onClick={()=>{setSortCol(null);setSortDir(null)}} title="Click to clear sort">Sort: {Object.keys(COL_FIELD).find(k=>COL_FIELD[k]===sortCol)||sortCol} {sortDir==="desc"?"▼":"▲"} ✕</span>}
<span style={{fontSize:9,color:"var(--t2)",marginLeft:"auto"}}>{voView==="home"?(filteredCards.length+" projects · "+vo.length+" VOs · Approved: $"+apTotal.toLocaleString("en-AU",{maximumFractionDigits:0})):(voFilt.length+" of "+vo.length+" · Approved: $"+apTotal.toLocaleString("en-AU",{maximumFractionDigits:0}))}</span>
</div>

{/* Add form (visible on home with project picker, or in project view with project pre-selected) */}
{(voView==="project"||voView==="home")&&sa&&<div style={{padding:8,background:"var(--s2)",borderRadius:4,marginBottom:6,display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
{voView==="project"
  ?<span style={{padding:"3px 8px",fontSize:10,background:"var(--s2)",border:"1px dashed var(--bd)",borderRadius:4,color:"var(--t2)",fontWeight:600,cursor:"not-allowed"}} title="Project locked — already selected from card view">{selectedProject}</span>
  :<select value={nvo.project} onChange={e=>sNvo({...nvo,project:e.target.value})} style={{padding:"3px 6px",fontSize:10}}><option value="">Project...</option>{pj.filter(p=>isRealProject(p.nm)).map(p=><option key={p.nm} value={p.nm}>{p.nm}</option>)}</select>
}
<select value={nvo.type} onChange={e=>sNvo({...nvo,type:e.target.value})} style={{padding:"3px 6px",fontSize:10}}><option>VO</option><option>DL</option></select>
<input placeholder="Var No." value={nvo.varNo} onChange={e=>sNvo({...nvo,varNo:e.target.value})} style={{width:60,padding:"3px 6px",fontSize:10}}/>
<input placeholder="Name" value={nvo.varName} onChange={e=>sNvo({...nvo,varName:e.target.value})} style={{width:140,padding:"3px 6px",fontSize:10}}/>
<button className="pl gn" onClick={addV}>Add</button>
</div>}

{/* HOME VIEW: project cards grid */}
{voView==="home"&&<div className="pj-grid">
{filteredCards.length===0?<div style={{gridColumn:"1/-1",textAlign:"center",padding:40,color:"var(--t2)"}}>{vo.length===0?"No variations yet — click + Add VO above to create your first one.":"No projects match your search."}</div>:filteredCards.map(c=><div key={c.name} className="pj-card" style={{"--card-accent":stripeColor(c.projectStatus)}} onClick={()=>{setSelectedProject(c.name);setVoView("project");setFiltSt([]);setFiltTy("all");setFiltPj("")}}>
<div className="pjnm">{c.name}</div>
<div className="pjmeta">{c.vos} VO{c.vos!==1?"s":""} · ${c.total.toLocaleString("en-AU",{maximumFractionDigits:0})}</div>
<div className="pjcaps">{VO_ST.map(s=>{const cnt=c.statusCounts[s.v]||0;return<button key={s.v} className={"pjcap"+(cnt===0?" zero":"")} style={{borderColor:s.c,color:s.c,background:cnt===0?"transparent":s.c+"15"}} onClick={e=>{e.stopPropagation();setSelectedProject(c.name);setVoView("project");setFiltSt([s.v]);setFiltTy("all");setFiltPj("")}}>{s.v==="(blank)"?"No Status":s.v.split(" - ")[0].split(" ").slice(0,2).join(" ")} ({cnt})</button>})}</div>
</div>)}
</div>}

{/* DETAIL VIEW: table — shown for project drill-in or status flat view */}
{voView!=="home"&&
<div className="vw"><datalist id="vo-projects-list">{pj.map(p=><option key={p.nm} value={p.nm}/>)}</datalist><div className="vsc"><table className="vt" style={{width:VO_HEADERS_FULL.reduce((a,h,i)=>a+(hideCols.has(h)?0:colW[i]),0)+"px"}}><colgroup>{VO_HEADERS_FULL.map((h,i)=>hideCols.has(h)?null:<col key={i} style={{width:colW[i]+"px"}}/>)}</colgroup><thead><tr>
{VO_HEADERS_FULL.map((h,ci)=>{
  if(hideCols.has(h))return null;
  const eW=k=>hideCols.has(VO_HEADERS_FULL[k])?0:colW[k];
  const fld=COL_FIELD[h];
  const isSorted=fld&&sortCol===fld;
  const arrow=isSorted?(sortDir==="asc"?" ▲":" ▼"):"";
  const stickyLeft=ci<8?Array.from({length:ci}).reduce((a,_,k)=>a+eW(k),0):0;
  return <th key={h+ci} className={ci<2?"":ci<12?"tg":ci<15?"ty":ci<20?"tp":"tg"} onClick={()=>cycleSort(fld)} style={{width:eW(ci),minWidth:30,cursor:fld?"pointer":"default",userSelect:"none",...(ci<8?{position:"sticky",left:stickyLeft,zIndex:5,background:ci<2?"#fff":ci<12?"#eef9f3":ci<15?"#fdf3e9":"#f3eefb"}:{}),borderRight:ci===7?"2px solid var(--bd)":undefined}}>{h==="☐"?<input type="checkbox" checked={voFilt.length>0&&voFilt.every(v2=>selRows.has(v2.vid))} onChange={e=>{if(e.target.checked){const n=new Set(selRows);voFilt.forEach(v2=>n.add(v2.vid));setSelRows(n)}else{setSelRows(new Set())}}} style={{cursor:"pointer"}}/>:<>{h}{arrow}</>}{ci>0&&<div className="col-resize" onMouseDown={e=>{e.stopPropagation();startResize(ci,e)}}/>}</th>
})}
</tr></thead><tbody>
{voFilt.length===0?<tr><td colSpan={23} style={{textAlign:"center",padding:20,color:"var(--t2)"}}>No entries.</td></tr>:
voFilt.map((v,vi)=>{const mg=v.pr-v.em-v.pf;const rc=voRowColor(v.st);const bg="#fff";const hA=hideCols.has("Area on Job"),hC=hideCols.has("Claim %");const w=(i)=>(i===3&&hA)?0:colW[i];return<tr key={v.vid||v.i} style={{color:rc,opacity:v._pending?0.55:1}} title={v._pending?"Saving... please wait before editing":editTip(v.eb,v.ea)}>
<td style={{textAlign:"center",padding:0,width:24,position:"sticky",left:0,zIndex:2,background:bg}}><button onClick={()=>dVO(v)} style={{background:"none",border:"none",color:"var(--rd)",cursor:"pointer",fontSize:14,fontWeight:700,opacity:.4}} onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=.4} title="Delete">×</button></td>
<td style={{textAlign:"center",padding:0,position:"sticky",left:w(0),zIndex:2,background:bg}}><input type="checkbox" checked={selRows.has(v.vid)} onChange={e=>{const n=new Set(selRows);if(e.target.checked)n.add(v.vid);else n.delete(v.vid);setSelRows(n)}} style={{cursor:"pointer"}}/></td>
<td style={{position:"sticky",left:w(0)+w(1),zIndex:2,background:bg}}><DebInput list="vo-projects-list" value={v.pj} onSave={val=>uV(v.vid,"pj",val)} style={{color:rc,width:"100%"}}/></td>
{!hA&&<td style={{position:"sticky",left:w(0)+w(1)+w(2),zIndex:2,background:bg}}><DebInput value={v.area||""} onSave={val=>uV(v.vid,"area",val)} style={{color:rc,width:"100%"}}/></td>}
<td style={{position:"sticky",left:w(0)+w(1)+w(2)+w(3),zIndex:2,background:bg}}><select value={v.ty} onChange={e=>uV(v.vid,"ty",e.target.value)} style={{background:"transparent",border:"none",color:rc,fontSize:10,width:"100%"}}><option>VO</option><option>DL</option></select></td>
<td style={{position:"sticky",left:w(0)+w(1)+w(2)+w(3)+w(4),zIndex:2,background:bg}}><DebInput value={v.vn} onSave={val=>uV(v.vid,"vn",val)} style={{color:rc}}/></td>
<td style={{position:"sticky",left:w(0)+w(1)+w(2)+w(3)+w(4)+w(5),zIndex:2,background:bg}}><DebInput value={v.srn||""} onSave={val=>uV(v.vid,"srn",val)} style={{color:rc}}/></td>
<td style={{position:"sticky",left:w(0)+w(1)+w(2)+w(3)+w(4)+w(5)+w(6),zIndex:2,borderRight:"2px solid var(--bd)",background:bg}}><DebInput value={v.vnm} onSave={val=>uV(v.vid,"vnm",val)} maxLen={100} style={{color:rc}}/></td>
<td><DebInput value={v.ds} onSave={val=>uV(v.vid,"ds",val)} format={fmD} placeholder="dd-mm-yy" style={{color:rc}}/></td>
<td><DebInput value={v.da} onSave={val=>uV(v.vid,"da",val)} format={fmD} placeholder="dd-mm-yy" style={{color:rc}}/></td>
<td style={{textAlign:"right"}}><EC value={v.pr} onChange={val=>uV(v.vid,"pr",val)} cls="cl" style={{color:rc}} fmt={fmP}/></td>
{!hC&&<td><DebInput value={v.claim||""} onSave={val=>uV(v.vid,"claim",val)} style={{color:rc,width:"100%"}}/></td>}
<td><select value={v.st} onChange={e=>uV(v.vid,"st",e.target.value)} style={{background:"transparent",border:"none",color:rc,fontSize:10,fontWeight:600,width:"100%"}}><option value="">—</option>{VO_ST.map(s=><option key={s.v} value={s.v}>{s.v}</option>)}</select></td>
<td style={{textAlign:"right"}}><EC value={v.em} onChange={val=>uV(v.vid,"em",val)} cls="cl" style={{color:rc}} fmt={fmP}/></td>
<td style={{textAlign:"right"}}><EC value={v.pf} onChange={val=>uV(v.vid,"pf",val)} cls="cl" style={{color:rc}} fmt={fmP}/></td>
<td style={{textAlign:"right",color:rc,fontFamily:"var(--mn)"}}>{mg?fmP(mg):""}</td>
<td style={{textAlign:"right"}}><EC value={v.nmn} onChange={val=>uV(v.vid,"nmn",val)} cls="cl" style={{color:rc}} fmt={fmN}/></td>
<td style={{textAlign:"right"}}><EC value={v.nh} onChange={val=>uV(v.vid,"nh",val)} cls="cl" style={{color:rc}} fmt={fm2}/></td>
<td style={{textAlign:"right"}}><EC value={v.nr} onChange={val=>uV(v.vid,"nr",val)} cls="cl" style={{color:rc}} fmt={fmP}/></td>
<td style={{textAlign:"right"}}><EC value={v.oh} onChange={val=>uV(v.vid,"oh",val)} cls="cl" style={{color:rc}} fmt={fm2}/></td>
<td style={{textAlign:"right"}}><EC value={v.or2} onChange={val=>uV(v.vid,"or2",val)} cls="cl" style={{color:rc}} fmt={fmP}/></td>
<td style={{textAlign:"center"}} onClick={()=>{setNoteEdit(v.vid);setNoteText(v.notes||"")}}>{v.notes?<span title={v.notes} style={{cursor:"pointer",fontSize:14}}>💬</span>:<span style={{cursor:"pointer",color:"var(--t2)",fontSize:12}}>+</span>}</td>
<td style={{textAlign:"center"}}>{!v.pushedAt?<button className="push-btn" onClick={()=>pushVO(v)} style={{background:"var(--gn)"}} title="Draft — not yet pushed">Push</button>:<span style={{fontSize:9,color:"var(--t2)",cursor:"help"}} title={"Pushed by "+(v.pushedBy||"?")+" · "+fmEdAt(v.pushedAt)+" — edits now flow live"}>Pushed {fmD(v.pushedAt)}</span>}</td>
</tr>})}
</tbody></table></div></div>}

{/* Notes modal */}
{noteEdit!==null&&(()=>{const ne=vo.find(x=>x.vid===noteEdit);return<div className="notes-modal" onClick={()=>setNoteEdit(null)}>
<div className="notes-box" onClick={e=>e.stopPropagation()}>
<h4>Notes — {ne?.vnm||ne?.pj||"Entry"}</h4>
<textarea value={noteText} onChange={e=>setNoteText(e.target.value)} autoFocus placeholder="Type notes here..."/>
<div className="nbtn">
<button className="pl" onClick={()=>setNoteEdit(null)}>Cancel</button>
<button className="pl gn" onClick={()=>{uV(noteEdit,"notes",noteText);setNoteEdit(null)}}>Save</button>
</div></div></div>})()}
</>}
{selCells.length>0&&<div className="stat-bar" onClick={clearSel}>
<span className="stat-lbl">Click to clear · {selCells.length} cell{selCells.length>1?"s":""}</span>
<span className="stat-lbl">Sum: </span><span>${selCells.reduce((a,b)=>a+b,0).toLocaleString("en-AU",{maximumFractionDigits:0})}</span>
<span className="stat-lbl">Avg: </span><span>${Math.round(selCells.reduce((a,b)=>a+b,0)/selCells.length).toLocaleString("en-AU")}</span>
<span className="stat-lbl">Count: </span><span>{selCells.length}</span>
</div>}
</div>}

ReactDOM.render(<App/>,document.getElementById("root"));
</script></body></html>
